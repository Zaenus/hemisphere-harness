[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hemisphere-harness"
version = "0.1.0"
description = "An agent harness modelled on McGilchrist's Master and Emissary: a generative right hemisphere leads, a calibrated decision model serves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Zaenus" }]
keywords = [
    "ai-agents", "llm", "agent-framework", "decision-model", "human-in-the-loop",
    "ollama", "mcgilchrist", "calibration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
dev = [
    "hemisphere-harness[web]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Zaenus/hemisphere-harness"
Documentation = "https://github.com/Zaenus/hemisphere-harness/blob/main/docs/architecture.md"
Issues = "https://github.com/Zaenus/hemisphere-harness/issues"
Changelog = "https://github.com/Zaenus/hemisphere-harness/releases"

[project.scripts]
hemisphere-harness = "hemisphere_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hemisphere_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
