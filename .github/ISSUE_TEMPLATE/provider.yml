name: New provider
description: Ask for, or offer, support for a model service.
labels: [provider]
body:
  - type: dropdown
    id: side
    attributes:
      label: Which hemisphere
      options: [Right (a generative LLM), Left (a decision model), Both]
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Service and documentation link
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Does it speak the OpenAI chat-completions protocol, or /v1/systemone?
      options: [OpenAI-compatible, System One (/v1/systemone), Its own API, Not sure]
  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to add it yourself?
      options:
        - label: Yes, docs/providers.md has the guide.
