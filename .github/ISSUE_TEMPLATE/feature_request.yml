name: Idea or feature request
description: Something the harness should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: hemispheres
    attributes:
      label: Which hemisphere does it belong to?
      description: Optional. Does it widen what the left may do alone, or change what reaches the right or a person? CONTRIBUTING.md lists what the design protects.
