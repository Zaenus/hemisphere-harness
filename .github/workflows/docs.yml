name: Docs

# Builds the documentation site from README.md, CONTRIBUTING.md and docs/, and publishes
# it to GitHub Pages. Pages must be set to deploy from GitHub Actions in the repository's
# settings.

on:
  push:
    branches: [main]
    paths: [README.md, CONTRIBUTING.md, "docs/**", mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10"
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
