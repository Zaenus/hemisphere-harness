# The whole harness on one machine, offline: the web UI, and Ollama serving the tev1
# decision model as the left hemisphere.
#
#   docker compose up -d
#   docker compose logs harness      the sign-in link is printed here
#
# The first start downloads tev1 (4.6 GB). The right hemisphere is yours to choose in the
# UI's settings: a hosted model with its key, or another model on this Ollama. To start
# with a local right, set SEED_RIGHT_MODEL (for example gemma4) in a .env file next to
# this one; it is pulled on first start too.

services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # With an NVIDIA GPU and the NVIDIA Container Toolkit, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  models:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LEFT_MODEL: ${SEED_LEFT_MODEL:-tev1}
      RIGHT_MODEL: ${SEED_RIGHT_MODEL:-}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$LEFT_MODEL\" && if [ -n \"$$RIGHT_MODEL\" ]; then ollama pull \"$$RIGHT_MODEL\"; fi"]
    restart: "no"

  harness:
    build: .
    image: hemisphere-harness:local
    depends_on:
      models:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"   # this machine only; see the README before changing it
    environment:
      HARNESS_WEB_TOKEN: ${HARNESS_WEB_TOKEN:-}
      SEED_LEFT_MODEL: ${SEED_LEFT_MODEL:-tev1}
      SEED_RIGHT_MODEL: ${SEED_RIGHT_MODEL:-}
      SEED_OLLAMA_URL: http://ollama:11434
    volumes:
      - harness:/data
    restart: unless-stopped

volumes:
  ollama:
  harness:
